# Supabase's free plan PAUSES a project after about 7 days without activity, and a paused
# project makes the remedy search fail. This touches both projects every 2 days so that
# they stay awake. (It cannot revive a project that is already paused - do that in the
# Supabase dashboard: Restore project.)
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */2 * *"     # every 2nd day, 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Materia medica database (project rtfjnfepikhahzospnqq)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://rtfjnfepikhahzospnqq.supabase.co/rest/v1/remedies?select=id&limit=1" \
            -H "apikey: sb_publishable_ShTSTQZ53xOuyr3PTbI07g_148-AsRc")
          echo "materia medica: HTTP $code"
          [ "$code" = "200" ]
      - name: App database - patients and history (project zlsinlcskirptxgqkzuw)
        run: |
          # a 200 or 401/403 both prove the project is awake; a paused project does not answer
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://zlsinlcskirptxgqkzuw.supabase.co/rest/v1/?apikey=sb_publishable_ZsjID9eVwGBMmtwrvJuRWA_EONoqF7M")
          echo "app database: HTTP $code"
          case "$code" in 200|401|403) exit 0;; *) exit 1;; esac
