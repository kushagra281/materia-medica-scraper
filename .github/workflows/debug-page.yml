# Manual: show how the scraper reads one page (no database writes).
name: Debug page
on:
  # Also runs on a pull request that touches debug_page.py or this file (that also registers the
  # workflow, which GitHub did not list after the first merge).
  pull_request:
    paths: [debug_page.py, .github/workflows/debug-page.yml]
  workflow_dispatch:
    inputs:
      url:
        description: "Page URL"
        default: "https://www.materiamedica.info/en/materia-medica/william-boericke/strychninum-phosphoricum"
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run (the URL goes through an env var, never into the shell source)
        env:
          PAGE_URL: ${{ inputs.url || 'https://www.materiamedica.info/en/materia-medica/william-boericke/strychninum-phosphoricum' }}
        run: python debug_page.py "$PAGE_URL" | tee out.txt
      - name: Summary
        run: |
          { echo '## Debug page'; echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
